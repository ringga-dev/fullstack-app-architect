name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Typecheck & Test
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Archive bundle
        run: |
          mkdir -p dist-bundle
          tar czf dist-bundle/fullstack-app-architect-${{ github.ref_name }}.tar.gz \
            agents orchestrator config templates examples schemas adapters bin README.md RUNBOOK.md CHANGELOG.md LICENSE package.json run.sh run.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bundle/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
